<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>besseleth Clipper</title>
<style>
  body {
    width: 320px;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 13px;
    margin: 0;
    padding: 14px;
    color: #1a1a1a;
    background: #fff;
  }
  h1 { font-size: 14px; margin: 0 0 10px; }
  label { display: block; font-size: 11px; opacity: 0.7; margin: 10px 0 4px; }
  textarea, input[type=text] {
    width: 100%;
    box-sizing: border-box;
    padding: 6px 8px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-family: inherit;
    font-size: 13px;
  }
  textarea { min-height: 90px; resize: vertical; }
  button {
    margin-top: 10px;
    padding: 7px 14px;
    border: none;
    border-radius: 6px;
    background: #4a90d9;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #3a7bc0; }
  button.secondary {
    background: none;
    border: 1px solid #ccc;
    color: #333;
  }
  #status { margin-top: 8px; font-size: 12px; }
  #status.ok { color: #1e7d6f; }
  #status.err { color: #c0392b; }
  details { margin-top: 14px; border-top: 1px solid #eee; padding-top: 8px; }
  summary { cursor: pointer; font-size: 12px; opacity: 0.75; }
  .hint { font-size: 11px; opacity: 0.6; margin-top: 4px; }
  .toggle-row { display: flex; align-items: center; gap: 8px; margin: 10px 0 4px; }
  .toggle-row .toggle-label { margin: 0; font-size: 12px; opacity: 1; flex: 1; }
  .toggle-row .toggle-state { font-size: 11px; font-weight: 600; width: 26px; text-align: right; }
  .toggle-row .toggle-state.on { color: #1e7d6f; }
  .toggle-row .toggle-state.off { color: #888; }

  /* Switch, not a checkbox */
  .switch { position: relative; display: inline-block; width: 34px; height: 20px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch-track {
    position: absolute; inset: 0; background: #ccc; border-radius: 999px;
    cursor: pointer; transition: background 0.15s;
  }
  .switch-track::before {
    content: ""; position: absolute; width: 16px; height: 16px; left: 2px; top: 2px;
    background: #fff; border-radius: 50%; transition: transform 0.15s;
    box-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
  .switch input:checked + .switch-track { background: #4a90d9; }
  .switch input:checked + .switch-track::before { transform: translateX(14px); }
</style>
</head>
<body>
  <h1>Add to besseleth</h1>
  <label for="text">Content</label>
  <textarea id="text" placeholder="Selected text from the page, or paste anything here."></textarea>
  <label for="url">URL</label>
  <input type="text" id="url" placeholder="https://...">
  <button id="addBtn">Add</button>
  <div id="status"></div>

  <details>
    <summary>Settings</summary>
    <label for="serverUrl">besseleth server URL</label>
    <input type="text" id="serverUrl" placeholder="http://127.0.0.1:5050">
    <button class="secondary" id="saveBtn">Save</button>
    <p class="hint">Only localhost/127.0.0.1 works without an extra permission grant. For a besseleth
      running elsewhere on your network, saving a non-local URL will prompt for one-time access.</p>

    <div class="toggle-row">
      <label class="toggle-label" for="perPostToggle">In-page clipping</label>
      <span class="toggle-state" id="perPostToggleState">On</span>
      <label class="switch">
        <input type="checkbox" id="perPostToggle" checked>
        <span class="switch-track"></span>
      </label>
    </div>
  </details>

  <script src="popup.js"></script>
</body>
</html>
