# besseleth config — copy to config.yaml and edit.

industry:
  name: "Neurotechnology"
  # Keywords used across arXiv, news and event searches. Be specific —
  # broad single words like "brain" will flood the report with noise.
  keywords:
    - "neurotechnology"
    - "brain-computer interface"
    - "neural implant"
    - "neuroprosthetics"
    - "EEG wearable"
  # arXiv categories to search (see https://arxiv.org/category_taxonomy)
  arxiv_categories:
    - "q-bio.NC"
    - "eess.SP"
    - "cs.HC"

  # Numeric/categorical metrics to track over time across devices/systems
  # in the industry — see the `trends` section below and devices.yaml.
  # This schema is generic on purpose; swap keys for whatever your
  # industry measures. The neurotech defaults below cover the physical
  # performance metrics (ITR, longevity, electrode count, material,
  # device type, FDA status) — see `company_metrics` further down for
  # the business-side ones (funding, stock).
  trend_metrics:
    - key: "information_transfer_rate"
      label: "Information transfer rate"
      unit: "bits/min"
      type: "numeric"
    - key: "longevity_days"
      label: "Implant longevity"
      unit: "days in vivo"
      type: "numeric"
    - key: "electrode_count"
      label: "Electrode count"
      unit: "electrodes"
      type: "numeric"
    - key: "device_type"
      label: "Device type"
      type: "categorical"
      # Free text, but keeping to a consistent vocabulary makes the
      # "color by" dropdown in the trends explorer more useful:
      # EEG, ECoG, CNS implant (e.g. intracortical), PNS implant, EMG
    - key: "material"
      label: "Electrode/substrate material"
      type: "categorical"
      # e.g. "platinum-iridium", "silicon", "polyimide", "carbon fiber"
    - key: "fda_status"
      label: "FDA regulatory status"
      type: "categorical"

  # Company-level business metrics, tracked separately from devices (a
  # company can ship several devices) — see companies.yaml.
  company_metrics:
    - key: "funding_total_usd"
      label: "Total funding raised"
      unit: "USD"
      type: "numeric"
    - key: "stock_price"
      label: "Stock price"
      unit: "USD"
      type: "numeric"

sources:
  arxiv:
    enabled: true
    max_results_per_keyword: 15
    days_back: 8

  news:
    enabled: true
    days_back: 8
    # Any RSS/Atom feed works. Google News RSS search is a good free
    # catch-all; add trade-press feeds for better signal.
    feeds:
      - "https://news.google.com/rss/search?q={query}&hl=en-US&gl=US&ceid=US:en"
      - "https://www.technologyreview.com/feed/"
      - "https://spectrum.ieee.org/feeds/topic/biomedical.rss"
    # Optional: set NEWSAPI_KEY env var to also pull from newsapi.org.
    use_newsapi: false

  blogs:
    enabled: true
    days_back: 8
    # Company engineering blogs, lab blogs, researcher Substacks. Any
    # Substack works at https://<name>.substack.com/feed — no API needed.
    feeds:
      - "https://neuralink.com/blog/feed/"
      - "https://example-neurotech-researcher.substack.com/feed"

  conferences:
    enabled: true
    # No good free structured API for conferences exists, so this is a
    # curated, hand-maintained list. Add/edit freely — each entry is
    # matched against `industry.keywords` by name/description. Optionally
    # add `news_feed` (an RSS/Atom feed the conference itself publishes —
    # accepted-talk announcements, CFP deadlines, its own blog) and those
    # get pulled in as a separate "conference news" section.
    #
    # ⚠️ Verify every URL below yourself before relying on it — these were
    # written from general knowledge, not confirmed by browsing, and
    # conference URLs/dates change. SfN and the BCI Society are real
    # organizations; the exact URL/month may have moved. Delete anything
    # you haven't checked, and add the real events for your industry.
    watchlist:
      - name: "Society for Neuroscience (SfN) Annual Meeting"
        url: "https://www.sfn.org/meetings"
        month: "October"    # verify — SfN's meeting date varies by year
      - name: "BCI Society Meeting"
        url: "https://bcisociety.org/"
        month: "June"       # verify — check bcisociety.org for the current date

  # IRL events near you — meetups, demo nights, local talks. See
  # besseleth/scrapers/events_scraper.py for the real capabilities/limits
  # of Luma and Eventbrite's free APIs (both are narrower than a plain
  # "find events near me" search); the paste/upload fallback is the
  # reliable free path for true geo-discovery.
  events:
    enabled: true
    dropbox_dir: "event_drops"
    # Recurring meetups/series you already know about. Empty by default —
    # add your own; don't invent one. Find yours by searching Luma/
    # Eventbrite/Meetup for your industry + your city, e.g. "neurotech
    # meetup san francisco" on lu.ma, then paste the real URL here.
    watchlist: []
    luma:
      # .ics feed URL per Luma calendar you follow — see the "Subscribe"
      # button on the calendar's page for the link.
      luma_calendar_ical_urls: []
    eventbrite:
      # Not a geo search — lists events for organizers you specify.
      # Requires EVENTBRITE_TOKEN env var (free personal OAuth token).
      organizer_ids: []

  social:
    enabled: true
    days_back: 8
    dropbox_dir: "social_drops"
    bluesky:
      enabled: true               # free public search API, no key needed
      max_results_per_keyword: 25
    twitter:
      # X's free API tier has no search endpoint (removed 2023) — a paid
      # Basic plan (~$200/mo as of writing) + X_BEARER_TOKEN env var is
      # required for live search. Without a token this falls back to
      # social_drops/ paste-in — or the browser extension in extension/,
      # which adds a selected tweet with one click, no API needed at all.
      enabled: true
      max_results_per_keyword: 25

  linkedin:
    enabled: true
    # LinkedIn actively blocks and prohibits automated scraping in its
    # Terms of Service — this repo does not scrape linkedin.com directly.
    # Default path: paste/upload content yourself (free, no ToS risk) —
    #   - drop .txt/.md files into `dropbox_dir` (one snippet per file, or
    #     several separated by a line of "---"); besseleth picks them up
    #     on every `fetch` and files them under dropbox_dir/processed/
    #   - or run `python -m besseleth.cli linkedin-add` and paste a post/
    #     job listing directly, no file needed
    # Either way it flows through the normal pipeline: keyword matching,
    # personalization against your contacts' companies, and the report.
    provider: "manual"          # "manual" (default) or a licensed provider name
    dropbox_dir: "linkedin_drops"
    # For a licensed provider instead (Proxycurl, Coresignal, official
    # LinkedIn Talent API, ...): set provider + api_key_env and implement
    # the call in besseleth/scrapers/linkedin_scraper.py (fetch()).
    api_key_env: "PROXYCURL_API_KEY"
    company_pages: []           # e.g. ["neuralink", "synchron-med"]

# People you know — used to personalize the report. If a scraped item
# (esp. a job posting or company news) mentions a company in this list,
# it gets flagged and surfaced separately with the contact's name.
contacts:
  - name: "Jane Doe"
    company: "Neuralink"
    role: "Research Scientist"
  - name: "Sam Lee"
    company: "Synchron"
    role: "Product Manager"

enrichment:
  # After every fetch, besseleth asks the local LLM to tag each new
  # arXiv/news/blog item with structured metadata (org, org type,
  # modality, therapeutic target, location) and a 1-5 novelty score (how
  # surprising it is vs. other recent items on the same topic) — this is
  # what powers the dashboard's filterable Papers table and Map tab.
  # When an item reports concrete numbers, the same pass also drafts and
  # adds rows to the devices/companies tables in the db (metrics/funding)
  # automatically — additive only, never overwrites an existing entry,
  # and every auto-added row is tagged auto_extracted: true so it's
  # visibly distinct from a hand-verified one. Bounded per
  # run so one fetch cycle can't trigger unbounded LLM calls; catches up
  # over successive fetches if there's a backlog, or run
  # `besseleth.cli enrich --all` to process everything at once. Requires
  # summarizer.backend: "ollama" to actually extract anything — without
  # it, items are marked "unknown" rather than left unprocessed forever.
  # Locations are geocoded for free via OpenStreetMap/Nominatim (rate-
  # limited to ~1 req/sec per its usage policy, cached in
  # .geocode_cache.json so a place is only ever looked up once).
  #
  # If enrichment runs are making your machine unusable: this is Ollama
  # doing local LLM inference, which is CPU-heavy per item. Levers, in
  # order of impact:
  #   - Lower max_items_per_run so each run (each fetch, or each "Enrich
  #     now" click) does less work before returning.
  #   - Set pause_seconds so it sleeps between items instead of running
  #     flat-out for the whole batch — turns a CPU spike into a trickle.
  #   - Set summarizer.num_thread below to cap how many cores Ollama uses
  #     per call.
  #   - Run `besseleth.cli enrich --all` yourself via `nice -n 19` (macOS/
  #     Linux) at a time you don't need the machine, instead of relying
  #     on the bounded per-fetch runs or the dashboard's "Enrich now"
  #     button — a backlog otherwise "catches up" a little at a time and
  #     items stay showing "pending" in the dashboard until their turn
  #     comes, which is expected, not stuck.
  enabled: true
  max_items_per_run: 10   # was 20 — smaller bursts, catches up over more fetches instead of one big spike
  pause_seconds: 2        # sleep between items during a run — turns a CPU spike into a trickle
  sources: ["arxiv", "news", "blog"]

  # A separate pass, independent of the LLM extraction above: for orgs
  # that have no location at all (never mentioned in any item's text),
  # tries to find its headquarters — see besseleth/web_lookup.py. Three
  # tiers: Wikidata, then Wikipedia's own coordinates if Wikidata's
  # property graph didn't resolve (this pair reliably covers real
  # institutions — universities, labs, research institutes almost
  # always have one or the other), then a general DuckDuckGo web search
  # read by the local LLM for anything neither knows about (covers
  # small/early-stage companies, at the cost of an LLM call — Ollama
  # required for this tier). Runs every enrich call, bounded per run
  # since a never-checked org costs a few requests; cached (found or not) so a
  # miss isn't re-queried every time.
  max_org_lookups_per_run: 8
  location_recheck_days: 30

summarizer:
  # Uses a local LLM via Ollama (https://ollama.ai) — free, runs offline.
  # `ollama pull llama3.1` (or any model you like) before running.
  backend: "ollama"          # "ollama" or "none" (extractive fallback)
  ollama_url: "http://localhost:11434"
  model: "llama3.1"
  max_items_per_summary_call: 8
  num_thread: 4              # cap CPU threads Ollama uses per call — was unset (its default, usually ALL cores),
                              # which is the actual cause of "the whole computer slows to a crawl" during a
                              # fetch: Ollama itself is a separate process doing the heavy lifting here, not
                              # besseleth's own code, so this is the one setting besseleth can hand it to keep
                              # some cores free for everything else you're running. 4 is a reasonable default for
                              # most laptops; raise it if enrichment feels too slow and your machine can spare it,
                              # lower it (e.g. 2) if it's still too disruptive.

jobs:
  # Job postings for the orgs besseleth has extracted from items (see the
  # Orgs tab) — pulled from each org's own Greenhouse/Lever/Ashby job-
  # board API, not scraped HTML, so it only covers orgs on one of those
  # platforms. Runs after enrichment each fetch (it needs the orgs
  # enrichment just found). Kept in sync: a posting no longer listed by
  # an org gets marked removed rather than deleted, so the Jobs tab
  # reflects what's actually open right now, not everything ever seen.
  #
  # Board lookup is two-layered: auto-detect first tries a few slug
  # guesses per org against each platform (and caches the result, found
  # or not, so it isn't re-probed every run — a miss retries after
  # recheck_days in case the org sets one up later); for an org it can't
  # find, or guesses wrong, add a manual entry to job_boards.yaml (see
  # job_boards.example.yaml) — manual always wins over auto-detect.
  enabled: true
  recheck_days: 14
  max_new_probes_per_run: 15   # caps how many never-seen orgs get auto-probed per run (each costs up to ~12 requests)
  manual_boards_path: "job_boards.yaml"

report:
  output_dir: "reports"
  format: "markdown"         # "markdown" or "html"
  max_items_per_section: 12
  email:
    enabled: false
    smtp_host: "smtp.gmail.com"
    smtp_port: 587
    smtp_user_env: "REPORT_SMTP_USER"
    smtp_pass_env: "REPORT_SMTP_PASS"
    to: []

database:
  path: "data/besseleth.db"

schedule:
  # Runs besseleth continuously in-process — start `besseleth.web.app` or
  # `besseleth.cli serve` once (e.g. as a launchd/systemd service) and it
  # keeps itself updated on this schedule, no cron needed. Set enabled:
  # false to go back to only running when you trigger it (CLI `run`, or
  # the dashboard's "Run now" button).
  enabled: true
  fetch_interval_hours: 6      # how often to pull fresh items into the DB
  report_cron: "0 8 * * MON"   # 5-field cron (UTC) for rendering the weekly report

trends:
  # Manually (via the dashboard's Trends tab) or LLM-drafted, then
  # auto-added — see besseleth/trends/store.py. Both datasets live in the
  # main sqlite db now, not a YAML file; these two keys only matter if
  # you have an old devices.yaml/companies.yaml from before that move —
  # they're imported once, automatically, then safe to delete.
  devices_path: "devices.yaml"
  companies_path: "companies.yaml"
  charts_dir: "reports/trends"

reports:
  # How report files pile up in report.output_dir. `report_cron` (above,
  # in `schedule`) controls *when* a report is generated — daily
  # ("0 8 * * *"), weekly ("0 8 * * MON"), monthly ("0 8 1 * *"), yearly
  # ("0 8 1 1 *"), whatever cron expression you want. This section
  # controls what happens to old ones: `keep_last` prunes automatically
  # (0/omitted = keep everything; delete manually from the dashboard's
  # report sidebar or `besseleth.cli report-delete <id>` instead).
  keep_last: 0
